syntax = "proto3";

package megame.common;

option go_package = "github.com/megame/server/internal/proto;common";
option csharp_namespace = "Megame.Common";

message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message Quaternion {
  float x = 1;
  float y = 2;
  float z = 3;
  float w = 4;
}

message Transform {
  Vector3 position = 1;
  Quaternion rotation = 2;
  Vector3 scale = 3;
}

message Color {
  float r = 1;
  float g = 2;
  float b = 3;
  float a = 4;
}

message Bounds {
  Vector3 center = 1;
  Vector3 size = 2;
}