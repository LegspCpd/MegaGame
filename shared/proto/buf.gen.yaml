version: v2
plugins:
  - local: protoc-gen-go
    out: ../server/internal/proto
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../server/internal/proto
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
  - remote: buf.build/grpc/ecosystem/csharp:v1.12.0
    out: ../../client/Assets/Scripts/Generated/Proto
    opt:
      paths=source_relative
      csharp_namespace=Megame