name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  GO_VERSION: '1.23'
  UNITY_VERSION: '2022.3.20f1'
  DOCKER_REGISTRY: ghcr.io
  # GHCR requires a lowercase path of the form <owner>/<image>.
  IMAGE_NAME: legspcpd/megame

jobs:
  protobuf:
    name: Generate Protobuf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1.50.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          version: 1.32.0

      - name: Install protoc plugins
        run: |
          set -euo pipefail
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.35.1
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate Go protos
        working-directory: shared/proto
        run: buf generate

      - name: Generate C# protos
        working-directory: shared/proto
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler

          # protoc's C# generator emits message classes only. The gRPC client
          # and server stubs GameClient.cs depends on come from Grpc.Tools,
          # which ships the native grpc_csharp_plugin inside its NuGet package
          # (it is not installable with `dotnet tool install`).
          GRPC_TOOLS_VERSION=2.71.0
          if command -v grpc_csharp_plugin >/dev/null; then
            GRPC_PLUGIN="$(command -v grpc_csharp_plugin)"
          else
            NUPKG=/tmp/grpc.tools.nupkg
            curl -fsSL "https://www.nuget.org/api/v2/package/Grpc.Tools/${GRPC_TOOLS_VERSION}" -o "$NUPKG"
            rm -rf /tmp/grpc.tools && mkdir -p /tmp/grpc.tools
            unzip -q "$NUPKG" -d /tmp/grpc.tools
            GRPC_PLUGIN="$(find /tmp/grpc.tools -type f -name 'grpc_csharp_plugin*' | head -1)"
            if [ -z "$GRPC_PLUGIN" ]; then
              echo "::error::grpc_csharp_plugin not present in Grpc.Tools ${GRPC_TOOLS_VERSION}"
              find /tmp/grpc.tools -maxdepth 3 -type d | head -20
              exit 1
            fi
            chmod +x "$GRPC_PLUGIN"
            echo "Using $GRPC_PLUGIN"
          fi

          OUT=../../client/Assets/Scripts/Generated/Proto
          rm -rf "$OUT"
          mkdir -p "$OUT"
          protoc \
            --csharp_out="$OUT" --csharp_opt=base_namespace=Megame \
            --grpc_out="$OUT" --grpc_opt=base_namespace=Megame \
            --plugin=protoc-gen-grpc="$GRPC_PLUGIN" \
            *.proto
          # protoc emits one subdirectory per proto package; Unity needs them flat.
          find "$OUT" -mindepth 2 -name '*.cs' -exec mv -t "$OUT" {} +
          find "$OUT" -mindepth 1 -type d -empty -delete

      - name: Verify generated files
        run: |
          set -euo pipefail
          ls -la server/internal/proto/*/*.pb.go
          ls -la client/Assets/Scripts/Generated/Proto/*.cs
          # The Unity client binds to GameService.GameServiceClient, so the gRPC
          # stubs must be present, not just the message classes. The plugin
          # names the file after the .proto that declares the service
          # (network.proto -> NetworkGrpc.cs).
          if [ ! -f client/Assets/Scripts/Generated/Proto/NetworkGrpc.cs ]; then
            echo "::error::NetworkGrpc.cs missing - gRPC stubs were not generated"
            ls client/Assets/Scripts/Generated/Proto/ || true
            exit 1
          fi
          grep -q "class GameServiceClient" client/Assets/Scripts/Generated/Proto/NetworkGrpc.cs

      - name: Upload generated protos
        uses: actions/upload-artifact@v4
        with:
          name: generated-protos
          path: |
            server/internal/proto
            client/Assets/Scripts/Generated/Proto
          retention-days: 7

  go-build:
    name: Go Server Build
    needs: protobuf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download proto artifacts
        uses: actions/download-artifact@v4
        with:
          name: generated-protos
          path: .

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Download dependencies
        working-directory: server
        run: go mod tidy && go mod verify

      - name: Check formatting
        working-directory: server
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -w .
            exit 1
          fi

      - name: Build and vet
        working-directory: server
        run: |
          go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.version=${{ github.ref_name }} -X main.commit=${{ github.sha }}" \
            -o megame-server ./cmd/server

      - name: Run tests
        working-directory: server
        run: go test -v ./...

      - name: Build Windows server
        working-directory: server
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build \
            -ldflags="-s -w -X main.version=${{ github.ref_name }} -X main.commit=${{ github.sha }}" \
            -o megame-server.exe ./cmd/server

      - name: Package server artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp server/megame-server dist/
          cp server/megame-server.exe dist/
          cp README.md dist/ 2>/dev/null || true
          tar -czf dist/megame-server-${{ github.ref_name }}-linux-amd64.tar.gz -C dist megame-server
          (cd dist && zip -q megame-server-${{ github.ref_name }}-windows-amd64.zip megame-server.exe)
          ls -la dist/

      - name: Upload server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: megame-server
          path: |
            dist/megame-server-${{ github.ref_name }}-linux-amd64.tar.gz
            dist/megame-server-${{ github.ref_name }}-windows-amd64.zip
          retention-days: 7

  unity-build:
    name: Unity Client Build (${{ matrix.target.label }})
    needs: protobuf
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # Linux and Windows are both published; Windows is the platform the dev
      # box runs. fail-fast is off so one broken target still reports the other.
      fail-fast: false
      matrix:
        target:
          - label: linux
            unityTarget: StandaloneLinux64
            buildTarget: linux
            folder: linux
            binary: MegaGame
            archive: linux-amd64
            packageCommand: >-
              tar -czf megame-client-${{ github.ref_name }}-linux-amd64.tar.gz -C build/linux .
          - label: windows
            unityTarget: StandaloneWindows64
            buildTarget: windows
            folder: windows
            binary: MegaGame.exe
            archive: windows-amd64
            packageCommand: >-
              zip -q -r megame-client-${{ github.ref_name }}-windows-amd64.zip build/windows
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download protobuf artifacts
        uses: actions/download-artifact@v4
        with:
          name: generated-protos
          path: .


      - name: Check Unity license is configured
        run: |
          missing=0
          for v in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v secret is not set on this repository."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the missing secrets under Settings -> Secrets so the Unity client can be built."
            exit 1
          fi
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      # Downloading the generated-protos artifact overwrites files in the
      # checkout, so the workspace is intentionally dirty. The build version
      # comes from -buildVersion below, not from semantic git versioning.
      #
      # unity-builder@v4 activates inside the build container and only supports
      # serial+account (UNITY_SERIAL derived from UNITY_LICENSE + EMAIL +
      # PASSWORD) or a floating UNITY_LICENSING_SERVER. Its former
      # manualLicenseFile branch was removed in v4, so all three secrets are
      # required; there is no separate pre-activation step (unity-activate runs
      # in a throwaway container and its result never reaches this one).
      # Builds the client for every desktop platform we ship. The Windows
      # player is what the dev machine actually runs, so both are produced.
      # matrix.target drives targetPlatform / the output folder / the archive
      # name; BuildScript.PerformClientBuild also reads UNITY_BUILD_TARGET.
      - name: Build Unity Project (${{ matrix.target.label }})
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_BUILD_TARGET: ${{ matrix.target.buildTarget }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: client
          targetPlatform: ${{ matrix.target.unityTarget }}
          buildMethod: Megame.Client.BuildScript.PerformClientBuild
          customParameters: >-
            -buildVersion ${{ github.ref_name }}
            -outputPath /github/workspace/build/${{ matrix.target.folder }}
            -buildTarget ${{ matrix.target.buildTarget }}
          versioning: None
          allowDirtyBuild: true

      - name: Verify player was produced (${{ matrix.target.label }})
        run: |
          set -euo pipefail
          if [ ! -f "build/${{ matrix.target.folder }}/${{ matrix.target.binary }}" ]; then
            echo "::error::No player at build/${{ matrix.target.folder }}/${{ matrix.target.binary }}"
            find build -maxdepth 3 -type f | head -20 || true
            exit 1
          fi
          # unity-builder builds inside a container as root, so the player is owned
          # by root and a plain chmod fails with EPERM. The Unity player is already
          # executable, so this is best-effort only and must not fail the job.
          chmod +x "build/${{ matrix.target.folder }}/${{ matrix.target.binary }}" 2>/dev/null \
            || sudo chmod +x "build/${{ matrix.target.folder }}/${{ matrix.target.binary }}" || true
          ls -la "build/${{ matrix.target.folder }}/"

      - name: Package client (${{ matrix.target.label }})
        run: ${{ matrix.target.packageCommand }}

      # Windows ships as a real installer: a per-user Inno Setup package with
      # an uninstaller, Start Menu / optional desktop shortcut and a post-install
      # launch. ISCC is a Windows binary, so it runs under wine on this runner.
      - name: Build Windows installer
        if: matrix.target.label == 'windows'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine64
          curl -fsSL -o /tmp/innosetup.exe \
            https://files.jrsoftware.org/is/6/innosetup-6.2.2.exe
          sudo mkdir -p /opt/innosetup
          sudo wine64 /tmp/innosetup.exe /VERYSILENT /SUPPRESSMSGBOXES \
            /NORESTART /SP- /DIR="C:\\innosetup"
          sudo chown -R "$(id -u):$(id -g)" /opt/innosetup

          mkdir -p dist/windows/publish
          cp -r build/windows/. dist/windows/publish/

          export WINEPREFIX=/tmp/wineprefix
          export WINEDEBUG=-all
          # ISCC resolves Source: paths relative to the script location, and the
          # script uses ..\dist\windows\publish, so run it from client\build.
          wine64 /opt/innosetup/ISCC.exe \
            /DMyAppVersion=${{ github.ref_name }} \
            client/build/installer/MegaGame.iss
          ls -la dist/

      - name: Upload ${{ matrix.target.label }} build
        uses: actions/upload-artifact@v4
        with:
          name: megame-client-${{ matrix.target.label }}
          path: |
            megame-client-${{ github.ref_name }}-${{ matrix.target.archive }}.*
            dist/MegaGame-Setup-*.exe
          retention-days: 7

  docker-build:
    name: Docker Build & Push
    needs: [go-build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Context is the repository root: the image build generates protos from
      # shared/proto, which sits outside the server directory.
      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile.optimized
          target: runtime
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-server:${{ github.ref_name }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-server:latest
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create GitHub Release
    needs: [go-build, unity-build]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
