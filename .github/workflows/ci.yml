name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  GO_VERSION: '1.23'
  UNITY_VERSION: '2022.3.20f1'

jobs:
  protobuf:
    name: Generate Protobuf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          version: 1.32.0

      - name: Install protoc plugins
        run: |
          set -euo pipefail
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.35.1
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate Go protos
        working-directory: shared/proto
        run: buf generate

      - name: Generate C# protos
        working-directory: shared/proto
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          OUT=../../client/Assets/Scripts/Generated/Proto
          rm -rf "$OUT"
          mkdir -p "$OUT"
          protoc --csharp_out="$OUT" --csharp_opt=base_namespace=Megame *.proto
          # protoc emits one subdirectory per proto package; Unity needs them flat.
          find "$OUT" -mindepth 2 -name '*.cs' -exec mv -t "$OUT" {} +
          find "$OUT" -mindepth 1 -type d -empty -delete

      - name: Verify generated files
        run: |
          set -euo pipefail
          ls -la server/internal/proto/*/*.pb.go
          ls -la client/Assets/Scripts/Generated/Proto/*.cs

      - name: Upload generated protos
        uses: actions/upload-artifact@v4
        with:
          name: generated-protos
          path: |
            server/internal/proto
            client/Assets/Scripts/Generated/Proto
          retention-days: 7

  go-build:
    name: Go Server Build
    needs: protobuf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download proto artifacts
        uses: actions/download-artifact@v4
        with:
          name: generated-protos
          path: .

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Download dependencies
        working-directory: server
        run: go mod tidy && go mod verify

      - name: Build and vet
        working-directory: server
        run: |
          go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o megame-server ./cmd/server

      - name: Run tests
        working-directory: server
        run: go test ./...

      - name: Upload server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: megame-server
          path: server/megame-server
          retention-days: 7

  unity-build:
    name: Unity Client Build
    needs: protobuf
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download protobuf artifacts
        uses: actions/download-artifact@v4
        with:
          name: generated-protos
          path: .


      - name: Activate Unity License
        uses: game-ci/unity-activate@v2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

      - name: Build Unity Project (Linux)
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: client
          targetPlatform: StandaloneLinux64
          buildMethod: Megame.Client.BuildScript.PerformClientBuild
          customParameters: -buildVersion ${{ github.ref_name }}
          compression: lz4hc

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: megame-linux
          path: build/
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs: [go-build, unity-build]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-assets/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
