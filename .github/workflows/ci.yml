# ============================================================================
# CI/CD PIPELINE - Uses buf for reliable protobuf generation
# ============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  GO_VERSION: '1.23'
  UNITY_VERSION: '2022.3.20f1'
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

jobs:
  # PROTOBUF GENERATION (via buf for reliability)
  protobuf:
    name: Generate Protobuf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Protobuf via buf
        uses: bufbuild/buf-action@v1
        working-directory: shared/proto
        with:
          args: generate

      - name: Verify generated files
        run: |
          ls -la server/internal/proto/*.pb.go
          ls -la client/Assets/Scripts/Generated/Proto/*.cs
          echo "All proto files generated successfully"

      - name: Upload generated protos
        uses: actions/upload-artifact@v4
        with:
          name: generated-protos
          path: |
            server/internal/proto
            client/Assets/Scripts/Generated/Proto
          retention-days: 7

  # Go Server Build & Test
  go-build:
    name: Go Server Build
    needs: protobuf
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download proto artifacts
        uses: actions/download-artifact@v4
        with:
          name: generated-protos
          path: server/internal/proto

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./server/coverage.out

      - name: Build server
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o megame-server ./cmd/server

      - name: Build server (Windows)
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build \
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o megame-server.exe ./cmd/server

      - name: Upload server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: megame-server
          path: |
            server/megame-server
            server/megame-server.exe
          retention-days: 7

  # Unity Client Build
  unity-build:
    name: Unity Client Build
    needs: protobuf
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download protobuf artifacts
        uses: actions/download-artifact@v4
        with:
          name: generated-protos
          path: client/Assets/Scripts/Generated/Proto

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: |
            client/Library
            client/Temp
          key: unity-library-${{ runner.os }}-${{ hashFiles('client/Packages/manifest.json') }}
          restore-keys: |
            unity-library-${{ runner.os }}-

      - name: Install Unity
        uses: game-ci/unity-installer@v2
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          cacheKey: unity-${{ env.UNITY_VERSION }}

      - name: Activate Unity License
        uses: game-ci/unity-activate@v2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

      - name: Build Unity Project (Linux)
        uses: game-ci/unity-builder@v2
        with:
          projectPath: client
          targetPlatform: StandaloneLinux64
          buildMethod: Megame.Client.BuildScript.PerformClientBuild
          customParameters: -buildVersion ${{ github.ref_name }} -outputPath /github/workspace/build/linux
          compression: lz4hc

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: megame-linux
          path: build/
          retention-days: 7

  # Unity Windows Build
  unity-build-windows:
    name: Unity Build Windows
    needs: protobuf
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download protobuf artifacts
        uses: actions/download-artifact@v4
        with:
          name: generated-protos
          path: client/Assets/Scripts/Generated/Proto

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: |
            client/Library
            client/Temp
          key: unity-library-${{ runner.os }}-${{ hashFiles('client/Packages/manifest.json') }}
          restore-keys: |
            unity-library-${{ runner.os }}-

      - name: Install Unity
        uses: game-ci/unity-installer@v2
        with:
          unityVersion: ${{ env.UNITY_VERSION }}

      - name: Activate Unity License
        uses: game-ci/unity-activate@v2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

      - name: Build Windows Client
        uses: game-ci/unity-builder@v2
        with:
          projectPath: client
          targetPlatform: StandaloneWindows64
          buildMethod: Megame.Client.BuildScript.PerformClientBuild
          customParameters: -buildVersion ${{ github.ref_name }} -outputPath C:\github\workspace\build\windows
          compression: lz4hc

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: megame-windows
          path: build/
          retention-days: 7