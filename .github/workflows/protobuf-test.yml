name: Protobuf Test

on:
  push:
    tags: ['v*']

jobs:
  protobuf:
    name: Generate Protobuf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install buf
        run: |
          BUF_VERSION=1.32.0
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then ARCH="x86_64"; fi
          if [ "$ARCH" = "aarch64" ]; then ARCH="arm64"; fi
          curl -fsSL "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-${OS}-${ARCH}" -o /usr/local/bin/buf
          chmod +x /usr/local/bin/buf
          buf --version

      - name: Generate Protobuf
        working-directory: shared/proto
        run: |
          buf generate

      - name: Verify generated files
        run: |
          ls -la server/internal/proto/*.pb.go
          ls -la client/Assets/Scripts/Generated/Proto/*.cs
          echo "All proto files generated successfully"

      - name: Upload generated protos
        uses: actions/upload-artifact@v4
        with:
          name: generated-protos
          path:
            - server/internal/proto
            - client/Assets/Scripts/Generated/Proto
          retention-days: 7